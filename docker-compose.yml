services:
  timeline-server:
    build: .
    image: timeline-server:latest
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # Live reload for dev, the server-side analog of the client's `entr -r`:
    # run `docker compose watch`, and on a save to either source file Compose
    # rebuilds the image and relaunches the container. `rebuild` keeps the
    # baked-in/immutable image semantics (vs. syncing live code into a running
    # container), so what you test is what ships.
    develop:
      watch:
        - path: timeline_server.py
          action: rebuild
        - path: timeline_model.py
          action: rebuild
