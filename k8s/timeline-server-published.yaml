# Minikube deployment that runs the PUBLISHED server image from GHCR, rather
# than one built locally. This is the counterpart to timeline-server-local.yaml:
# same Deployment/Service names, same single-replica/Recreate rules, same
# NodePort (30080) — so the client's "Local minikube" entry works unchanged —
# but the image is pulled from the registry instead of built into minikube.
#
# Apply with scripts/test-latest-main-image-on-minikube.sh, which pre-pulls the
# image into minikube and forces a rollout. See timeline-server-local.yaml for
# why this must never scale past 1 replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeline-server
  labels:
    app: timeline-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: timeline-server
  template:
    metadata:
      labels:
        app: timeline-server
    spec:
      # Matches the non-root user baked into the image (useradd --uid 10001 app).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: timeline-server
          # The image the GitHub Actions workflow pushes on every push to main.
          # Must be a PUBLIC GHCR package so the kubelet can pull it without auth.
          image: ghcr.io/thomanil/timeline-server:latest
          # The test script pre-pulls this tag into minikube with
          # `minikube image pull`, so IfNotPresent reuses that freshly-pulled
          # copy (a rollout creates a new pod, which then picks it up). This
          # avoids the kubelet needing registry access of its own.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # Bind on all interfaces inside the pod. PORT defaults to 8000 via
            # the Dockerfile's ENV, so it's not repeated here.
            - name: HOST
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: timeline-server
  labels:
    app: timeline-server
spec:
  type: NodePort
  selector:
    app: timeline-server
  ports:
    - name: http
      protocol: TCP
      port: 8000        # cluster-internal Service port
      targetPort: 8000  # container port
      nodePort: 30080   # fixed external port (valid range 30000-32767)
