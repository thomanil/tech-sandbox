# Local minikube deployment for the timeline state server.
#
# Single replica on purpose: the server holds per-client state in memory and
# runs one ticker for everyone (see timeline_server.py), so it must never be
# scaled past 1 — a second pod would have its own independent state and the
# Service would split clients across them. The strategy is Recreate (not the
# default RollingUpdate) so the old pod is gone before the new one serves, for
# the same reason.
#
# Apply with scripts/deploy-minikube.sh, which builds the image straight into
# minikube and forces a rollout. The desktop client reaches this over the
# NodePort at ws://<minikube-ip>:30080/ws.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeline-server
  labels:
    app: timeline-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: timeline-server
  template:
    metadata:
      labels:
        app: timeline-server
    spec:
      # Matches the non-root user baked into the image (useradd --uid 10001 app).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: timeline-server
          image: timeline-server:latest
          # Use the image built into minikube; never try to pull from a registry.
          # With the :latest tag the default policy would be Always, which would
          # fail with ImagePullBackOff since this image only exists locally.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            # Bind on all interfaces inside the pod. PORT defaults to 8000 via
            # the Dockerfile's ENV, so it's not repeated here.
            - name: HOST
              value: "0.0.0.0"
            # Reach the SAME Postgres docker-compose stands up on the host
            # (published on :5432) — minikube resolves host.minikube.internal to
            # the host. Plain value, not a Secret: these are throwaway local dev
            # creds. sslmode=disable — the local container doesn't do TLS. NOTE:
            # the compose Postgres must be running, or this pod CrashLoops (the
            # server applies migrations on startup and that's fatal if the DB is
            # unreachable).
            #
            # The TRAILING DOT on the host (...internal.) is required, not a typo:
            # it makes the name a FQDN so the resolver skips the search domains in
            # the pod's resolv.conf (ndots:5). Without it, a slow search domain
            # (e.g. a Tailscale one) adds ~6s to every lookup, which blows past the
            # /readyz probe timeout and leaves the pod never-Ready.
            - name: DATABASE_URL
              value: "postgresql://timeline:timeline@host.minikube.internal.:5432/timeline?sslmode=disable"
          # Readiness pings the DB (/readyz) so a DB outage pulls the pod from the
          # Service; liveness stays on the cheap /healthz so a DB blip never
          # restart-loops a healthy process.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: timeline-server
  labels:
    app: timeline-server
spec:
  type: NodePort
  selector:
    app: timeline-server
  ports:
    - name: http
      protocol: TCP
      port: 8000        # cluster-internal Service port
      targetPort: 8000  # container port
      nodePort: 30080   # fixed external port (valid range 30000-32767)
