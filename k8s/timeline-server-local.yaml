# Local minikube deployment for the timeline state server.
#
# Single replica on purpose: the server holds per-client state in memory and
# runs one ticker for everyone (see timeline_server.py), so it must never be
# scaled past 1 — a second pod would have its own independent state and the
# Service would split clients across them. The strategy is Recreate (not the
# default RollingUpdate) so the old pod is gone before the new one serves, for
# the same reason.
#
# Apply with scripts/deploy-minikube.sh, which builds the image straight into
# minikube and forces a rollout. The desktop client reaches this over the
# NodePort at ws://<minikube-ip>:30080/ws.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeline-server
  labels:
    app: timeline-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: timeline-server
  template:
    metadata:
      labels:
        app: timeline-server
    spec:
      # Matches the non-root user baked into the image (useradd --uid 10001 app).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      # Block startup until the in-cluster Postgres accepts connections. The server
      # runs migrations on boot and dies if the DB is unreachable, so without this
      # a cold `deploy-minikube.sh` (DB + server applied together) would CrashLoop
      # the server until Postgres won the race. pg_isready ships in the postgres
      # image we already pull.
      initContainers:
        - name: wait-for-db
          image: postgres:18
          command:
            - sh
            - -c
            - |
              until pg_isready -h timeline-postgres -U timeline -d timeline; do
                echo "waiting for timeline-postgres..."; sleep 2
              done
      containers:
        - name: timeline-server
          image: timeline-server:latest
          # Use the image built into minikube; never try to pull from a registry.
          # With the :latest tag the default policy would be Always, which would
          # fail with ImagePullBackOff since this image only exists locally.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            # Bind on all interfaces inside the pod. PORT defaults to 8000 via
            # the Dockerfile's ENV, so it's not repeated here.
            - name: HOST
              value: "0.0.0.0"
            # Reach the IN-CLUSTER Postgres defined at the bottom of this manifest
            # (the timeline-postgres Service), NOT the host's docker-compose DB.
            # Plain value, not a Secret: these are throwaway local dev creds.
            # sslmode=disable — the local container doesn't do TLS.
            #
            # WHY in-cluster and not host.minikube.internal (which this used to be):
            # the server holds a psycopg pool open against the DB, and over the host
            # hop (pod → minikube docker bridge → host gateway → host :5432) those
            # async DB sockets stalled the single event loop ~190ms on EVERY
            # WebSocket send — even though a raw SELECT measured 0.1ms — dragging
            # playback from 5 to ~3 ticks/s. Keeping the DB on the cluster's own pod
            # network (like compose's same-network Postgres and UpCloud's managed
            # one) removes that hop and restores full-rate ticks. The server still
            # applies migrations on startup (fatal if the DB is down), so an
            # initContainer below blocks until Postgres is reachable to avoid a
            # CrashLoop on a cold cluster.
            - name: DATABASE_URL
              value: "postgresql://timeline:timeline@timeline-postgres:5432/timeline?sslmode=disable"
          # Readiness pings the DB (/readyz) so a DB outage pulls the pod from the
          # Service; liveness stays on the cheap /healthz so a DB blip never
          # restart-loops a healthy process.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              # NOTE: deliberately HIGHER than the upcloud manifest's "250m".
              # 250m is plenty on UpCloud's real, un-nested hardware, but this
              # minikube node runs as a Docker container inside an aarch64 Linux
              # VM that is itself nested on a Mac. Under that double virtualization
              # each instruction is slower, so the tiny per-tick work (5 ticks/s:
              # step + serialize + WS send + fire-and-forget DB persist) overruns
              # a 25ms/100ms CFS budget and the event loop gets throttled in ~2/3
              # of periods — playback visibly crawls. Confirmed via the pod's
              # cgroup cpu.stat (nr_throttled climbing). A roomier limit keeps the
              # timer wakeups on time. This is a local-only test manifest, so the
              # extra headroom costs nothing and never ships.
              cpu: "2"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: timeline-server
  labels:
    app: timeline-server
spec:
  type: NodePort
  selector:
    app: timeline-server
  ports:
    - name: http
      protocol: TCP
      port: 8000        # cluster-internal Service port
      targetPort: 8000  # container port
      nodePort: 30080   # fixed external port (valid range 30000-32767)
---
# In-cluster Postgres for local minikube testing.
#
# This deliberately does NOT reuse the host's docker-compose Postgres over
# host.minikube.internal (which an earlier version of this manifest did). Holding
# the server's psycopg pool open across that host hop stalled the single event
# loop ~190ms on every WebSocket send and dragged playback to ~3 ticks/s; an
# in-cluster DB keeps DB traffic on the fast pod network and restores 5/s. This is
# the same "DB local to the runtime" topology compose and UpCloud already have.
#
# Pinned to postgres:18 to match compose and UpCloud's managed 18. Single replica
# + Recreate because it owns one ReadWriteOnce PVC (two pods can't attach it at
# once). Throwaway local dev creds, cleartext (no TLS), same as the server's
# DATABASE_URL above. Inspect its data with:
#   kubectl exec deploy/timeline-postgres -- psql -U timeline -d timeline -c '...'
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timeline-postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeline-postgres
  labels:
    app: timeline-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: timeline-postgres
  template:
    metadata:
      labels:
        app: timeline-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_USER
              value: "timeline"
            - name: POSTGRES_PASSWORD
              value: "timeline"
            - name: POSTGRES_DB
              value: "timeline"
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "timeline", "-d", "timeline"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            # Postgres 18 stores data in a major-version subdir and wants the mount
            # at /var/lib/postgresql (NOT .../data, which 18 rejects). Mirrors the
            # compose volume note. See docker-library/postgres#37.
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: timeline-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: timeline-postgres
  labels:
    app: timeline-postgres
spec:
  selector:
    app: timeline-postgres
  ports:
    - port: 5432
      targetPort: 5432
