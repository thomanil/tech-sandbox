# UPCLOUD overlay (production on UpCloud Managed Kubernetes). Reproduces the
# effective output of the legacy k8s/timeline-server-upcloud.yaml. Differences
# from the base:
#   - imagePullPolicy: Always (real cluster with registry access; a rollout
#     restart on :latest then lands the freshest main build)
#   - DATABASE_URL from the `timeline-db` Secret (managed Postgres, password not
#     committed, sslmode=require enforced by UpCloud — the Secret is created out
#     of band per docs/upcloud-postgres.md and must exist before first deploy)
#   - exposed via a real cloud LoadBalancer (80 + 443) with the UpCloud LB config
#     annotation that terminates TLS at the LB and carries the WebSocket upgrade
# The single-replica/Recreate invariant and the split probes come from ../../base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# The running version is named HERE, by an immutable sha-<commit> tag. CI publishes
# only sha-* tags (docker/metadata-action type=sha,format=long — see
# .github/workflows/build-image.yml). Argo CD Image Updater (configured via the
# annotations on k8s/argocd/application-upcloud.yaml) watches GHCR for the newest
# sha-* build and commits the bump to THIS newTag (write-back-target: kustomization),
# after which Argo rolls it out. So this line is the single source of truth for the
# deployed commit; the value below is just the current seed — Image Updater keeps it
# current. Update it by hand only to pin/rollback to a specific commit.
images:
  - name: ghcr.io/thomanil/timeline-server
    newTag: sha-2ced2cec4345bfb9ebd506732aab1c6c0dbbb156

patches:
  # Deployment: always pull the freshest image, and source DATABASE_URL from the
  # managed-Postgres Secret (carries the password, so unlike local/published it is
  # NOT a cleartext value). The Secret must exist before the first deploy or the
  # pod won't start (CreateContainerConfigError).
  - target:
      kind: Deployment
      name: timeline-server
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: timeline-server
      spec:
        template:
          spec:
            containers:
              - name: timeline-server
                imagePullPolicy: Always
  # DATABASE_URL appended after HOST (matches legacy env order). Sourced from the
  # timeline-db Secret — carries the password, so not a cleartext value.
  - target:
      kind: Deployment
      name: timeline-server
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: timeline-db
              key: DATABASE_URL

  # Service: promote to a cloud LoadBalancer, publish 80 (plain HTTP for
  # healthz/curl) and add 443. Done as a JSON patch because the port list must be
  # edited in place (strategic merge would key on port number and ADD an 80 entry
  # rather than retype the existing one).
  - target:
      kind: Service
      name: timeline-server
    patch: |
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 80
      - op: add
        path: /spec/ports/-
        value:
          name: https
          protocol: TCP
          port: 443
          targetPort: 8000

  # The UpCloud LB config annotation, as a strategic-merge patch so the block
  # scalar's trailing newline is preserved verbatim.
  #
  # The 443 frontend is forced into http mode (not tcp): http mode terminates TLS
  # at the LB AND lets it carry the WebSocket upgrade, so clients reach the server
  # at wss://<host>/ws. The cert is attached by UUID (certificate_bundle_uuid) on
  # purpose — the LB is managed by the k8s CCM, which OVERWRITES any cert attached
  # by hand on the next reconcile; referencing the dynamic bundle by UUID here
  # makes the CCM re-attach it every reconcile, so the custom-domain cert is
  # durable. The "needs-certificate" auto-TLS trigger is NOT used (it only covers
  # the autogenerated lb-*.upcloudlb.com hostname, with no field for a custom
  # domain). On LB/cluster RECREATE the bundle UUID is new — recreate the dynamic
  # bundle, update this UUID, redeploy. See docs/upcloud-custom-domain-tls.md.
  - target:
      kind: Service
      name: timeline-server
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: timeline-server
        annotations:
          service.beta.kubernetes.io/upcloud-load-balancer-config: |
            {
              "frontends": [
                {
                  "name": "https",
                  "mode": "http",
                  "port": 443,
                  "tls_configs": [
                    { "name": "tknilsson-sandbox", "certificate_bundle_uuid": "0a1fe407-5173-4754-892b-afa6386c5a7f" }
                  ]
                }
              ]
            }
