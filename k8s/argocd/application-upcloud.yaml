# Argo CD Application — UPCLOUD cluster.
# Tells the Argo CD running in the upcloud cluster to keep timeline-server
# matching k8s/timeline-server/overlays/upcloud at main. This is the cluster
# that tracks real CI builds, so it's the one that will get image-automation
# (see PLAN.md #1, #5, #6).
#
# The upcloud overlay sources DATABASE_URL from the `timeline-db` Secret and the
# LB cert from the pinned bundle UUID — both created out of band (see PLAN.md #5,
# #8 and docs/upcloud-postgres.md / docs/upcloud-custom-domain-tls.md). Argo syncs
# the Deployment/Service; those out-of-band Secrets must already exist or the pod
# won't start.
#
# Apply once:
#   kubectl --context kubernetes-admin@tech-sandbox-upcloud-k8s-cluster \
#     apply -f k8s/argocd/application-upcloud.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: timeline-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thomanil/tech-sandbox.git
    targetRevision: main
    path: k8s/timeline-server/overlays/upcloud
  destination:
    server: https://kubernetes.default.svc   # the cluster Argo itself runs in
    namespace: timeline
  syncPolicy:
    automated:
      prune: true       # delete-from-Git => delete-from-cluster
      selfHeal: true    # revert manual kubectl edits back to Git
    syncOptions:
      - CreateNamespace=true
