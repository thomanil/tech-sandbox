# Build the timeline state server image, push it to GitHub Container Registry
# (GHCR), and roll it out to the public UpCloud cluster — the full CD path for
# every push to main. This is the CI counterpart to the local
# `minikube image build` in scripts/deploy-minikube.sh: instead of baking the
# image into one developer's minikube, it publishes a shareable artifact at
#   ghcr.io/<owner>/timeline-server:latest
# that scripts/test-latest-main-image-on-minikube.sh then pulls and runs.
#
# The package must be PUBLIC for the unauthenticated minikube pull to work. GHCR
# packages start private; flip it once under the package's settings (see README).
# After that, this workflow's GITHUB_TOKEN keeps publishing new versions.
#
# After the push, the deploy-upcloud job forces a rollout on UpCloud so the new
# :latest is actually pulled (imagePullPolicy: Always only re-pulls when a pod is
# created — nothing polls GHCR on its own). It authenticates with the kubeconfig
# committed at k8s/upcloud_timeline-public_kubeconfig.yaml, so no secret is
# needed. (That kubeconfig holds cluster-admin creds in the repo — convenient for
# a sandbox, but it's why this repo should stay private/trusted.)
name: Build, push, and deploy server image

on:
  push:
    branches: [main]
    # Only rebuild when something that actually ends up in the image changes —
    # a README/client-only push doesn't need a new server image. (The client is
    # excluded from the image via .dockerignore.)
    paths:
      - "app/server-python/timeline_server.py"
      - "app/server-python/timeline_model.py"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
      # The web client is built and baked into the image (Dockerfile web-build
      # stage), so any change to its source needs a rebuild.
      - "app/client-web/**"
  # Allow manual runs from the Actions tab (e.g. to republish without a code change).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository_owner is already lowercase ("thomanil"); GHCR requires that.
  IMAGE_NAME: ${{ github.repository_owner }}/timeline-server

jobs:
  # Static guardrail: the CI counterpart to the local pre-push hook. Runs the
  # same scripts/error_check.sh (tsc + eslint for the web client; py_compile +
  # ruff for Python) so broken code never gets built, pushed, or deployed. The
  # script installs the web deps (npm ci) and fetches ruff (via uvx) itself, so
  # this job just provides node + uv and runs it — one source of truth for
  # "is the code sound?", local and in CI.
  error-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the Dockerfile's web-build stage (node 22).
          node-version: "22"
          cache: npm
          cache-dependency-path: app/client-web/package-lock.json

      # Provides uv/uvx so scripts/error_check.sh can run ruff. python3 is already
      # on the ubuntu-latest runner, which covers the py_compile check.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run static error checks
        run: bash scripts/error_check.sh

  build-and-push:
    needs: error-check # don't build/push an image that fails the static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to GHCR with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + Buildx so we can emit a multi-arch image. The dev box is arm64
      # (Mac/Linux VM) but CI and other machines are amd64, so build both and
      # let the runtime pick the matching variant — same as the uv base image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags/labels. :latest is what the minikube test script pulls;
      # the immutable sha tag lets you pin/trace a specific build. The labels
      # include org.opencontainers.image.source, which links the GHCR package
      # back to this repo (so it inherits repo visibility and shows up there).
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in GitHub Actions cache to keep rebuilds fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous deployment: once the new image is in GHCR, roll it out to UpCloud.
  # Reuses scripts/deploy-upcloud.sh so CI does exactly what a local deploy does
  # (same manifest, context guard, rollout, and LB-address wait) — one source of
  # truth for "deploy to UpCloud".
  deploy-upcloud:
    needs: build-and-push # only deploy an image that actually built and pushed
    # Guard to main, so a workflow_dispatch from a feature branch can rebuild the
    # image without redeploying production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # only needs the repo (kubeconfig + manifest); no packages
    # Serialize deploys so two quick pushes don't race rollouts on the single
    # replica; queue rather than cancel so an in-flight rollout finishes.
    concurrency:
      group: upcloud-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      # The script pins KUBECONFIG to the committed UpCloud kubeconfig, asserts
      # the expected cluster context, applies the manifest, forces a rollout, and
      # waits for readiness. The load balancer already exists from the first
      # deploy, so its address resolves immediately here.
      - name: Roll out latest image to UpCloud
        run: bash scripts/deploy-upcloud.sh
