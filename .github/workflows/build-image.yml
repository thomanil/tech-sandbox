# Build the timeline state server image and push it to GitHub Container
# Registry (GHCR) on every push to main. This is the CI counterpart to the
# local `minikube image build` in scripts/deploy-minikube.sh: instead of baking
# the image into one developer's minikube, it publishes a shareable artifact at
#   ghcr.io/<owner>/timeline-server:latest
# that scripts/test-latest-main-image-on-minikube.sh then pulls and runs.
#
# The package must be PUBLIC for the unauthenticated minikube pull to work. GHCR
# packages start private; flip it once under the package's settings (see README).
# After that, this workflow's GITHUB_TOKEN keeps publishing new versions.
name: Build and push server image

on:
  push:
    branches: [main]
    # Only rebuild when something that actually ends up in the image changes —
    # a README/client-only push doesn't need a new server image. (The client is
    # excluded from the image via .dockerignore.)
    paths:
      - "timeline_server.py"
      - "timeline_model.py"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
  # Allow manual runs from the Actions tab (e.g. to republish without a code change).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository_owner is already lowercase ("thomanil"); GHCR requires that.
  IMAGE_NAME: ${{ github.repository_owner }}/timeline-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to GHCR with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + Buildx so we can emit a multi-arch image. The dev box is arm64
      # (Mac/Linux VM) but CI and other machines are amd64, so build both and
      # let the runtime pick the matching variant — same as the uv base image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags/labels. :latest is what the minikube test script pulls;
      # the immutable sha tag lets you pin/trace a specific build. The labels
      # include org.opencontainers.image.source, which links the GHCR package
      # back to this repo (so it inherits repo visibility and shows up there).
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in GitHub Actions cache to keep rebuilds fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
