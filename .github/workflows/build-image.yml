# Build the timeline state server image and push it to GitHub Container Registry
# (GHCR) on every push to main. This is the CI counterpart to the local
# `minikube image build` in scripts/deploy-minikube.sh: instead of baking the
# image into one developer's minikube, it publishes a shareable artifact at
#   ghcr.io/<owner>/timeline-server:sha-<commit>
# that scripts/test-latest-main-image-on-minikube.sh pulls and runs.
#
# Deployment to UpCloud is NOT done here anymore — it is GitOps/pull-based. Argo
# CD runs in the cluster and syncs k8s/timeline-server/overlays/upcloud from main;
# Argo CD Image Updater watches GHCR for the newest sha-* tag and commits the bump
# into overlays/upcloud/kustomization.yaml, which Argo then rolls out. So CI's job
# ends at "image is in GHCR"; nothing in this workflow touches the cluster.
#
# The package must be PUBLIC for the unauthenticated minikube pull (and the
# in-cluster Image Updater read) to work. GHCR packages start private; flip it
# once under the package's settings (see README). After that, this workflow's
# GITHUB_TOKEN keeps publishing new versions.
name: Build and push server image

on:
  push:
    branches: [main]
    # Only rebuild when something that actually ends up in the image changes —
    # a README/client-only push doesn't need a new server image. (The client is
    # excluded from the image via .dockerignore.)
    paths:
      - "app/server-python/timeline_server.py"
      - "app/server-python/timeline_model.py"
      # DB migrations are baked into the image and applied on startup, so a
      # migration change needs a rebuild.
      - "app/server-python/db/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
      # The web client is built and baked into the image (Dockerfile web-build
      # stage), so any change to its source needs a rebuild.
      - "app/client-web/**"
  # Allow manual runs from the Actions tab (e.g. to republish without a code change).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository_owner is already lowercase ("thomanil"); GHCR requires that.
  IMAGE_NAME: ${{ github.repository_owner }}/timeline-server

jobs:
  # Static guardrail: the CI counterpart to the local pre-push hook. Runs the
  # same scripts/error_check.sh (tsc + eslint for the web client; py_compile +
  # ruff for Python) so broken code never gets built, pushed, or deployed. The
  # script installs the web deps (npm ci) and fetches ruff (via uvx) itself, so
  # this job just provides node + uv and runs it — one source of truth for
  # "is the code sound?", local and in CI.
  error-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the Dockerfile's web-build stage (node 22).
          node-version: "22"
          cache: npm
          cache-dependency-path: app/client-web/package-lock.json

      # Provides uv/uvx so scripts/error_check.sh can run ruff. python3 is already
      # on the ubuntu-latest runner, which covers the py_compile check.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run static error checks
        run: bash scripts/error_check.sh

  build-and-push:
    needs: error-check # don't build/push an image that fails the static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to GHCR with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + Buildx so we can emit a multi-arch image. The dev box is arm64
      # (Mac/Linux VM) but CI and other machines are amd64, so build both and
      # let the runtime pick the matching variant — same as the uv base image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Emit ONLY the immutable sha-<full-commit> tag. There is deliberately no
      # mutable :latest anymore: under GitOps the running version is named in Git
      # (overlays/upcloud/kustomization.yaml) and bumped to the newest sha-* build
      # by Argo CD Image Updater. The labels include org.opencontainers.image.source,
      # which links the GHCR package back to this repo (so it inherits repo
      # visibility and shows up there).
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in GitHub Actions cache to keep rebuilds fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # NOTE: there is no deploy job. Deployment to UpCloud is GitOps/pull-based —
  # Argo CD (in-cluster) syncs k8s/timeline-server/overlays/upcloud from main and
  # Argo CD Image Updater bumps the image to the newest sha-* tag this workflow
  # just pushed. CI's responsibility ends once the image is in GHCR.
